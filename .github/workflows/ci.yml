name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: make deps
        
      - name: Lint & Format Check
        run: |
          make lint
          make format
          # Check if git is clean after format
          git diff --exit-code
        
      - name: Run Backend Tests
        run: make test-backend
        
      - name: Run Frontend Tests
        run: make test-frontend
