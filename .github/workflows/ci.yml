name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          
      - name: Install dependencies
        run: make deps

      - name: Build
        run: make build
        
      - name: Lint & Policy Check
        run: |
          make lint
          bun run policy

      - name: Go Vet
        run: make vet
        
      - name: Run Backend Tests
        run: make test-backend

      - name: Run Backend Race Tests
        run: make test-race
        
      - name: Run Frontend Tests
        run: make test-frontend

      - name: Run Playwright E2E Tests
        run: make test-e2e

