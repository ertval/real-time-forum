<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forum Home</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/home.css" />

    <!-- Global helpers FIRST -->
    <script src="/static/js/helper.js" defer></script>
    <script src="/static/js/header.js" defer></script>

    <!-- Page logic -->
    <script src="/static/js/home.js" defer></script>
  </head>

  <body class="home">
    <main class="container" aria-labelledby="forum-title">

      <!-- COMMON HEADER (loaded via JS) -->
      <div id="header"></div>

      <section class="posts" aria-labelledby="posts-title">
        <h2 id="posts-title" class="sr-only">Posts</h2>

        <div id="posts-output" class="posts-output"></div>

        <p id="posts-empty" class="muted" hidden role="status">
          No posts yet.
        </p>
      </section>
    </main>

    <!-- Load header partial + header.js -->
    <script>
      fetch("/static/partials/header.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("header").innerHTML = html;

          const script = document.createElement("script");
          script.src = "/static/js/header.js";
          script.onload = () => initHeader();
          document.body.appendChild(script);
        });
    </script>
  </body>
</html>
