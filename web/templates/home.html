<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forum Home</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/home.css" />

    <!-- logout logic -->
    <script src="/static/js/logout.js" defer></script>
  </head>

  <body class="home">
    <main class="container" aria-labelledby="forum-title">

      <!-- COMMON HEADER (loaded via JS) -->
      <div id="header"></div>

      <section class="posts" aria-labelledby="posts-title">
        <h2 id="posts-title" class="sr-only">Posts</h2>

        <!-- JS renders here -->
        <div id="posts-output" class="posts-output"></div>

        <!-- Empty state -->
        <p id="posts-empty" class="muted" hidden role="status">
          No posts yet.
        </p>
      </section>
    </main>

    <!-- Load header partial -->
    <script>
      fetch("/static/partials/header.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("header").innerHTML = html;
        })
        .catch(err => console.error("Failed to load header:", err));
    </script>

    <!-- common layout JS (greeting, auth buttons) -->
    <script src="/static/js/layout.js" defer></script>

    <!-- page-specific JS -->
    <script src="/static/js/home.js" defer></script>
  </body>
</html>
