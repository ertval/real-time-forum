<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forum Home</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/home.css" />
    <script src="/static/js/logout.js" defer></script>
  </head>

  <body class="home">
    <main class="container" aria-labelledby="forum-title">

      <header class="page-header">
        <div class="page-title-wrap">
          <h1 id="forum-title" class="page-title">Forum</h1>
          <p id="greeting" class="muted" aria-live="polite">
            Hello, Guest
          </p>
        </div>

        <div class="page-actions">
          <a
                  id="login-btn"
                  class="btn btn-secondary"
                  href="/login"
          >
            Login
          </a>

          <button
                  id = "logout-btn"
                  class="btn btn-secondary"
                  data-logout-button
                  data-logout-url="/api/v1/users/logout"
                  type="button"
          >
            Logout
          </button>

          <a class="btn btn-primary" href="/create-post">Create post</a>
        </div>
      </header>

      <section class="posts" aria-labelledby="posts-title">
        <h2 id="posts-title" class="sr-only">Posts</h2>

        <!-- JS renders here -->
        <div id="posts-output" class="posts-output"></div>

        <!-- Empty state -->
        <p id="posts-empty" class="muted" hidden role="status">
          No posts yet.
        </p>

      </section>
    </main>

    <script src="/static/js/home.js" defer></script>
  </body>
</html>
