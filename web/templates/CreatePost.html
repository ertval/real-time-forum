<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Post</title>
</head>

<body>
<main>
    <section aria-label="Create post">
        <h1>Create post</h1>

        <form action="/posts" method="post" novalidate>
            <div>
                <input
                        type="text"
                        name="title"
                        placeholder="Title"
                        maxlength="300"
                        required
                />
            </div>

            <div>
                <textarea
                        name="body"
                        placeholder="Body text (optional)"
                        rows="8"
                ></textarea>
            </div>

            <div>
                <button type="submit" name="action" value="draft">
                    Save Draft
                </button>

                <button type="submit" name="action" value="publish">
                    Post
                </button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
