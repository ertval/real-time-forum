<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password</title>

  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/forgot-password.css" />
  <script src="/static/js/forgot-password.js" defer></script>
</head>

<body class="forgot-password">
<main class="center-page">
  <section
          class="card card-pad"
          aria-labelledby="forgot-password-title"
  >
    <h1 id="forgot-password-title" class="forgot-password-title">
      Forgot Password
    </h1>

    <p class="muted forgot-password-text">
      Enter your email and we will send you a link to reset your password
    </p>

    <form action="/forgot-password" method="post" novalidate>
      <div class="field">
        <label for="email" class="field-label">Email</label>
        <input
                id="email"
                class="input"
                type="email"
                name="email"
                autocomplete="email"
                placeholder="Email"
                required
        />
      </div>

      <button class="btn btn-primary btn-full" type="submit">
        Submit
      </button>
    </form>

    <div class="forgot-password-back">
      <a href="/login">Back to login</a>
    </div>
  </section>
</main>
</body>
</html>
