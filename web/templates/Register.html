<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>

    <!-- Base styling -->
    <link rel="stylesheet" href="/css/base.css" />
</head>

<body>
<main class="center-page">
    <section class="card card-pad" aria-label="Register" style="width:100%; max-width:460px;">
        <h1 style="text-align:center; margin-bottom:8px;">Register</h1>
        <p class="muted" style="text-align:center; margin-bottom:22px;">
            Create an account to continue
        </p>

        <form action="/register" method="post" novalidate>
            <div class="field">
                <input
                        class="input"
                        type="text"
                        name="username"
                        autocomplete="username"
                        placeholder="Username"
                        required
                />
            </div>

            <div class="field">
                <input
                        class="input"
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Email"
                        required
                />
            </div>

            <div class="field" style="position:relative;">
                <input
                        class="input"
                        id="password"
                        type="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Password"
                        required
                />

                <!-- purely visual for now -->
                <button
                        type="button"
                        aria-label="Show password"
                        title="Show password"
                        style="
              position:absolute;
              right:10px;
              top:50%;
              transform:translateY(-50%);
              background:transparent;
              border:none;
              cursor:pointer;
              color:#94a3b8;
            "
                >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        />
                        <path
                                d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        />
                    </svg>
                </button>
            </div>

            <div class="field" style="position:relative;">
                <input
                        class="input"
                        id="confirm_password"
                        type="password"
                        name="confirm_password"
                        autocomplete="new-password"
                        placeholder="Confirm Password"
                        required
                />

                <!-- purely visual for now -->
                <button
                        type="button"
                        aria-label="Show confirm password"
                        title="Show confirm password"
                        style="
              position:absolute;
              right:10px;
              top:50%;
              transform:translateY(-50%);
              background:transparent;
              border:none;
              cursor:pointer;
              color:#94a3b8;
            "
                >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        />
                        <path
                                d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        />
                    </svg>
                </button>
            </div>

            <button class="btn btn-primary btn-full" type="submit">
                Create Account
            </button>

            <div style="text-align:center; margin-top:18px;">
                <span class="muted">Already have an account? </span>
                <a href="/login">Sign in</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
