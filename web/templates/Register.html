<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>
</head>

<body>
<main>
    <section aria-label="Register">
        <h1>Register</h1>
        <p>Create an account to continue</p>

        <form action="/register" method="post" novalidate>
            <div>
                <input
                        type="text"
                        name="username"
                        autocomplete="username"
                        placeholder="Username"
                        required
                />
            </div>

            <div>
                <input
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Email"
                        required
                />
            </div>

            <div>
                <input
                        id="password"
                        type="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Password"
                        required
                />

                <!-- purely visual for now; hook up with JS later -->
                <button type="button" aria-label="Show password" title="Show password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        />
                        <path
                                d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        />
                    </svg>
                </button>
            </div>

            <div>
                <input
                        id="confirm_password"
                        type="password"
                        name="confirm_password"
                        autocomplete="new-password"
                        placeholder="Confirm Password"
                        required
                />

                <button type="button" aria-label="Show confirm password" title="Show confirm password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        />
                        <path
                                d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        />
                    </svg>
                </button>
            </div>

            <div>
            </div>

            <button type="submit">Create Account</button>

            <div>
                <span>Already have an account? </span>
                <a href="/login">Sign in</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
