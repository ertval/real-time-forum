<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password</title>

  <!-- Base styling -->
  <link rel="stylesheet" href="/css/base.css" />
</head>

<body>
<main class="center-page">
  <section class="card card-pad" aria-label="Forgot password" style="width:100%; max-width:460px;">
    <h1 style="text-align:center; margin-bottom:12px;">Forgot Password</h1>

    <p class="muted" style="text-align:center; margin-bottom:20px;">
      Enter your email and we will send you a link to reset your password
    </p>

    <form action="/forgot-password" method="post" novalidate>
      <div class="field">
        <input
                class="input"
                type="email"
                name="email"
                autocomplete="email"
                placeholder="Email"
                required
        />
      </div>

      <button class="btn btn-primary btn-full" type="submit">
        Submit
      </button>
    </form>

    <div style="text-align:center; margin-top:18px;">
      <a href="/login">Back to login</a>
    </div>
  </section>
</main>
</body>
</html>
