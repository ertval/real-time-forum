<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Posts</title>

  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/header.css" />
  <link rel="stylesheet" href="/static/css/home.css" />
  <link rel="stylesheet" href="/static/css/posts.css" />


  <!-- helpers FIRST -->
  <script src="/static/js/helpers.js" defer></script>

  <!-- page logic -->
  <script type="module" src="/static/js/my-posts.js"></script>
</head>

<body>
<main class="container">

  <header class="page-header">
    <div class="page-title-wrap">
      <a href="/home" class="forum-logo">
        <h1 class="page-title">Forum</h1>
      </a>
    </div>

    <div class="page-actions">
      <label class="muted" for="status-filter">Status</label>
      <select id="status-filter" class="input status-filter">
        <option value="all">All</option>
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>
    </div>
  </header>

  <!-- POSTS -->
  <section class="posts">
    <div id="posts-output"></div>
    <p id="posts-empty" hidden>No posts yet.</p>
  </section>

</main>
</body>
</html>
