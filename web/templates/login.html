<!-- web/templates/login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In</title>

  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/login-register.css" />
  <link rel="stylesheet" href="/static/css/components/password-field.css" />
  <link rel="stylesheet" href="/static/css/ui-messages.css" />

  <script src="/static/js/helpers.js" defer></script>
  <script type="module" src="/static/js/ui-messages.js"></script>
  <script type="module" src="/static/js/login.js"></script>
</head>

<body class="login">
<main class="center-page">
  <section class="card card-pad login-card" aria-labelledby="login-title">
    <h1 id="login-title" class="login-title">Sign In</h1>

    <p class="muted login-subtitle">
      Enter your credentials to continue
    </p>

    <form action="/api/v1/users/login" method="post" novalidate>
      <div class="field">
        <label for="email" class="field-label">Email or username</label>
        <input
          id="email"
          class="input"
          type="text"
          name="identifier"
          autocomplete="username"
          placeholder="Email or username"
          required
        />
      </div>

      <div class="field password-field">
        <label for="password" class="field-label">Password</label>
        <div class="password-input-wrap">
          <input
            id="password"
            class="input"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            aria-label="Show password"
            title="Show password"
          >
            <!-- svg unchanged -->
          </button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" type="submit">
        Sign In
      </button>

      <div class="login-footer">
        <span class="muted">Don't have an account? </span>
        <a href="/register">Create one</a>
      </div>

      <div class="guest-login">
        <button
          type="button"
          class="btn btn-ghost btn-full"
          id="guest-login-btn"
        >
          Continue as guest
        </button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
