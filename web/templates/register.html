<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/login-register.css" />
</head>

<body class="auth register">
<main class="center-page">
    <section
            class="card card-pad auth-card"
            aria-labelledby="register-title"
    >
        <h1 id="register-title" class="auth-title">
            Register
        </h1>

        <p class="muted auth-subtitle">
            Create an account to continue
        </p>

        <form action="/register" method="post" novalidate>
            <div class="field">
                <label for="username" class="field-label">Username</label>
                <input
                        id="username"
                        class="input"
                        type="text"
                        name="username"
                        autocomplete="username"
                        placeholder="Username"
                        required
                />
            </div>

            <div class="field">
                <label for="email" class="field-label">Email</label>
                <input
                        id="email"
                        class="input"
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Email"
                        required
                />
            </div>

            <div class="field password-field">
                <label for="password" class="field-label">Password</label>
                <input
                        id="password"
                        class="input"
                        type="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Password"
                        required
                />

                <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        title="Show password"
                >
                    <!-- svg unchanged -->
                </button>
            </div>

            <div class="field password-field">
                <label for="confirm_password" class="field-label">
                    Confirm Password
                </label>
                <input
                        id="confirm_password"
                        class="input"
                        type="password"
                        name="confirm_password"
                        autocomplete="new-password"
                        placeholder="Confirm Password"
                        required
                />

                <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show confirm password"
                        title="Show confirm password"
                >
                    <!-- svg unchanged -->
                </button>
            </div>

            <button class="btn btn-primary btn-full" type="submit">
                Create Account
            </button>

            <div class="auth-footer">
                <span class="muted">Already have an account? </span>
                <a href="/login">Sign in</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
