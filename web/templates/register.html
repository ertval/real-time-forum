<!-- web/templates/register.html -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/login-register.css" />
    <link rel="stylesheet" href="/static/css/auth-modal.css"> 
    <link rel="stylesheet" href="/static/css/components/password-field.css" />
    <link rel="stylesheet" href="/static/css/ui-messages.css">

    <script type="module" src="/static/js/ui-messages.js"></script>
    <script type="module" src="/static/js/register.js"></script>
</head>

<body class="auth register">
<main class="center-page">
    <section
            class="card card-pad auth-card"
            aria-labelledby="register-title"
    >
        <h1 id="register-title" class="auth-title">
            Register
        </h1>

        <p class="muted auth-subtitle">
            Create an account to continue
        </p>

        <form action="/register" method="post" novalidate>
            <div class="field">
                <label for="username" class="field-label">Username</label>
                <input
                        id="username"
                        class="input"
                        type="text"
                        name="username"
                        autocomplete="username"
                        placeholder="Username"
                        required
                />
            </div>

            <div class="field">
                <label for="email" class="field-label">Email</label>
                <input
                        id="email"
                        class="input"
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Email"
                        required
                />
            </div>

            <div class="field password-field">
                <label for="password" class="field-label">Password</label>
                <div class ="password-input-wrap">
                    <input
                        id="password"
                        class="input"
                        type="password"
                        name="password"
                        autocomplete="new-password"
                        placeholder="Password"
                        required
                    />

                    <button
                        type="button"
                        class="password-toggle"
                        aria-label="Show password"
                        title="Show password"
                    >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                        <path
                            d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                    </button>
                </div>
            </div>


            <div class="field password-field">
                <label for="confirm_password" class="field-label">
                    Confirm Password
                </label>

                <div class="password-input-wrap">
                    <input
                    id="confirm_password"
                    class="input"
                    type="password"
                    name="confirm_password"
                    autocomplete="new-password"
                    placeholder="Confirm Password"
                    required
                    />

                    <button
                    type="button"
                    class="password-toggle"
                    aria-label="Show password"
                    title="Show password"
                    >
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path
                        d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        />
                        <path
                        d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        />
                    </svg>
                    </button>
                </div>
                </div>


            <button class="btn btn-primary btn-full" type="submit">
                Create Account
            </button>

            <div class="auth-footer">
                <span class="muted">Already have an account? </span>
                <a href="/login">Sign in</a>
            </div>

        </form>
    </section>
</main>
</body>
</html>
