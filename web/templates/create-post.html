<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Post</title>

  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/create-post.css" />

  <script type="module" src="/static/js/create-post.js"></script>
</head>

<body class="create-post">
<main class="center-page">
  <section class="card card-pad create-post-card" aria-labelledby="create-post-title">
    <h1 id="create-post-title" class="create-post-title">Create post</h1>

    <form id="create-post-form" novalidate>

      <div class="field">
        <label for="title" class="field-label">Title</label>
        <input
          id="title"
          class="input"
          type="text"
          name="title"
          placeholder="Title"
          maxlength="300"
          required
        />
      </div>

      <div class="field">
        <label for="body" class="field-label">Body</label>
        <textarea
          id="body"
          class="input"
          name="body"
          placeholder="Body"
          rows="8"
        ></textarea>
      </div>

      <div class="field">
        <label for="categorySelect" class="field-label">Category</label>
        <select id="categorySelect" class="input" required>
          <option value="">Select category</option>
        </select>
      </div>

      <div class="create-post-actions">
        <button class="btn btn-secondary" type="submit" name="action" value="draft">
          Save Draft
        </button>

        <button class="btn btn-primary" type="submit" name="action" value="publish">
          Post
        </button>
      </div>

      <div class="create-post-back">
        <a href="/" class="btn btn-ghost">
          ← Back to home
        </a>
      </div>

    </form>
  </section>
</main>
</body>
</html>
