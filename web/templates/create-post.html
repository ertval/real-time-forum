<!-- web/templates/create-post.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Post</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/create-post.css" />
  <link rel="stylesheet" href="/static/css/auth-modal.css">
  <link rel="stylesheet" href="/static/css/ui-messages.css">

  <script type="module" src="/static/js/ui-messages.js"></script>
  <script type="module" src="/static/js/create-post.js"></script>
</head>

<body class="create-post">
<main class="center-page">
  <section class="card card-pad create-post-card" aria-labelledby="create-post-title">
    <h1 id="create-post-title" class="create-post-title">Create post</h1>

    <form id="create-post-form" novalidate>

      <div class="field">
        <label for="title" class="field-label sr-only">Title</label>
        <input
          id="title"
          class="input"
          type="text"
          name="title"
          placeholder="Title"
          maxlength="300"
          required
        />
      </div>

      <div class="field">
        <label for="body" class="field-label sr-only">Body</label>
        <div class="textarea-wrap">
          <textarea
            id="body"
            class="input"
            name="body"
            placeholder="Write your post..."
            rows="8"
          ></textarea>
          <button
            type="button"
            class="attach-button"
            id="image-button"
            aria-label="Attach image"
          >
            <img src="/static/img/paperclip.png" alt="" />
          </button>
          <input
            id="image"
            class="sr-only"
            type="file"
            name="image"
            accept="image/jpeg,image/png,image/gif"
          />
        </div>
        <div class="image-meta">
          <div id="image-name" class="image-name muted" aria-live="polite"></div>
          <button type="button" class="image-clear" id="image-clear" aria-label="Remove image" hidden>
            ×
          </button>
        </div>
        <div id="image-preview" class="image-preview" hidden>
          <img alt="Selected upload preview" />
        </div>
      </div>

      <!-- MULTI CATEGORY CHECKBOXES -->
      <div class="field">
        <label class="field-label">Categories</label>
        <div id="categoryCheckboxes" class="category-checkboxes"></div>
      </div>

      <div class="create-post-actions">
        <button class="btn btn-secondary" type="submit" name="action" value="draft">
          Save Draft
        </button>

        <button class="btn btn-primary" type="submit" name="action" value="publish">
          Post
        </button>
      </div>

      <div class="create-post-back">
        <a href="/" class="btn btn-ghost">
          ← Back to home
        </a>
      </div>

    </form>
  </section>
</main>
</body>
</html>
