<!-- web/templates/view=post.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Post</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/view-post.css" />

    <script src="/static/js/helper.js" defer></script>
    <script src="/static/js/header.js" defer></script>
    <script src="/static/js/view-post.js" defer></script>
  </head>

  <body class="view-post">
    <main class="container">

      <!-- COMMON HEADER -->
      <div id="header"></div>

      <!-- POST -->
      <article class="card card-pad viewpost-card">
        <h1 class="viewpost-title"></h1>
        <p class="muted viewpost-author"></p>
        <time class="muted viewpost-time"></time>

        <p class="viewpost-body-text"></p>

        <!-- REACTIONS -->
        <div class="post-actions">

         <div class="reaction">
          <span id="like-count">0</span>
          <button
            class="btn btn-ghost"
            type="button"
            data-reaction="like"
          >
            Like
          </button>
        </div>

        <div class="reaction">
          <span id="dislike-count">0</span>
          <button
            class="btn btn-ghost"
            type="button"
            data-reaction="dislike"
          >
            Dislike
          </button>
        </div>

        </div>
      </article>

      <!-- COMMENTS -->
      <section class="comments-box">
        <div class="comments-list" id="comments-list"></div>

        <form class="comment-form" id="comment-form" hidden>
          <textarea
            id="comment-body"
            placeholder="Write a comment..."
            required
          ></textarea>
          <button class="btn btn-primary" type="submit">
            Comment
          </button>
        </form>
      </section>

    </main>

    <!-- LOAD HEADER PARTIAL -->
    <script>
      fetch("/static/partials/header.html")
        .then(r => r.text())
        .then(html => {
          document.getElementById("header").innerHTML = html;

          const s = document.createElement("script");
          s.src = "/static/js/header.js";
          s.onload = () => {
            if (typeof initHeader === "function") {
              initHeader();
            }
          };
          document.body.appendChild(s);
        });
    </script>
  </body>
</html>
