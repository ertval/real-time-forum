<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Post</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/view-post.css" />
  </head>

  <body class="view-post">
    <main class="container">

      <!-- common header -->
      <div id="header"></div>

      <article class="card card-pad viewpost-card">

        <header class="viewpost-header">
          <div class="viewpost-meta">
            <h1 class="viewpost-title"></h1>
            <p class="muted viewpost-author"></p>
          </div>

          <time class="muted viewpost-time"></time>
        </header>

        <section class="viewpost-body">
          <p class="viewpost-body-text"></p>
        </section>

        <section class="viewpost-actions">
          <div class="viewpost-reactions">
            <div class="reaction">
              <span id="like-count" class="reaction-count">0</span>
              <button class="btn btn-ghost" disabled>Like</button>
            </div>

            <div class="reaction">
              <span id="dislike-count" class="reaction-count">0</span>
              <button class="btn btn-ghost" disabled>Dislike</button>
            </div>
          </div>
        </section>

      </article>
    </main>

    <script>
      fetch("/static/partials/header.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("header").innerHTML = html;

          const script = document.createElement("script");
          script.src = "/static/js/header.js";
          script.defer = true;
          document.body.appendChild(script);
        });
    </script>

    <script src="/static/js/layout.js" defer></script>
    <script src="/static/js/view-post.js" defer></script>
  </body>
</html>
