<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Post</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/view-post.css" />
  </head>

  <body class="view-post">
    <main class="container" aria-labelledby="forum-title">

      <!-- common header (loaded via JS) -->
      <div id="header"></div>

      <article
        aria-label="Post"
        class="card card-pad viewpost-card"
      >
      </article>

    </main>

    <!-- Load header partial -->
    <script>
      fetch("/static/partials/header.html")
        .then(res => res.text())
        .then(html => {
          document.getElementById("header").innerHTML = html;
        });
    </script>

    <!-- common layout JS  -->
    <script src="/static/js/layout.js" defer></script>

    <!-- page-specific -->
    <script src="/static/js/view-post.js" defer></script>
  </body>
</html>
