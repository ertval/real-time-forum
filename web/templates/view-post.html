<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>View Post</title>

  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/header.css" />
  <link rel="stylesheet" href="/static/css/posts.css" />
  <link rel="stylesheet" href="/static/css/post-navigation.css" />

  <!-- page logic -->
  <script type="module" src="/static/js/view-post.js"></script>
</head>

<body>
  <main class="container">
    <div id="header"></div>

    <section class="posts">
      <div id="post-output"></div>
    </section>
  </main>

  <!-- NAVIGATION ARROWS -->
  <button
    id="post-prev"
    class="post-nav post-nav-left"
    aria-label="Previous post"
    hidden
  >
    ‹
  </button>

  <button
    id="post-next"
    class="post-nav post-nav-right"
    aria-label="Next post"
    hidden
  >
    ›
  </button>

  <script>
    fetch("/static/partials/header.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("header").innerHTML = html;

        const s = document.createElement("script");
        s.type = "module";                      
        s.src = "/static/js/header-loader.js";  
        document.body.appendChild(s);
      });
  </script>
</body>
</html>
