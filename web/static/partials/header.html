<!-- web/static/partials/header.html -->

<header class="page-header">
  <div class="page-title-wrap">
    <h1 id="forum-title" class="page-title">
      <a href="/" class="forum-logo">Forum</a>
    </h1>

    <p id="greeting" class="muted" aria-live="polite"></p>
  </div>

  <div class="page-actions">

    <a id="login-btn" class="btn btn-secondary" href="/login">
      Login
    </a>

    <button
      id="logout-btn"
      class="btn btn-secondary"
      data-logout-button
      data-logout-url="/api/v1/users/logout"
      type="button"
    >
      Logout
    </button>

    <a id="my-activity-btn" class="btn btn-primary" href="/activity" style="display:none">
      My Activity
    </a>

    <a id="create-post-btn" class="btn btn-primary" href="/create-post">
      Create post
    </a>

    <!-- NOTIFICATIONS -->
    <div class="notification-wrapper">
      <button
        id="notification-bell"
        class="icon-btn"
        aria-label="Notifications"
        type="button"
      >
        🔔
        <span id="notification-badge" class="notification-badge hidden">0</span>
      </button>

      <div id="notification-dropdown" class="notification-dropdown hidden">
        <div class="notification-header">
          Notifications
        </div>
        <div id="notification-list"></div>
      </div>
    </div>

    <!-- SETTINGS BUTTON -->
    <button
      id="settings-btn"
      class="icon-btn"
      aria-label="Settings"
      type="button"
    >
      ⚙️
    </button>

  </div>
</header>
