<!-- web/static/partials/header.html -->

<header class="page-header">
  <div class="page-title-wrap">
    <h1 id="forum-title" class="page-title">
      <a href="/" class="forum-logo" aria-label="Forum home">
        <img src="/static/img/forum-logo.png" alt="Forum">
      </a>
    </h1>

    <p id="greeting" class="muted" aria-live="polite"></p>
  </div>

  <div class="page-actions">

    <!-- GUEST ONLY -->
    <a
      id="login-btn"
      class="btn btn-secondary"
      href="/login"
    >
      Login
    </a>

    <!-- AUTH ICONS GROUP -->
    <div class="auth-buttons auth-only">

      <!-- MY ACTIVITY -->
      <a
        id="my-activity-btn"
        class="header-icon"
        href="/activity"
        aria-label="My activity"
      >
        <img src="/static/img/my-activity.png" alt="My activity">
      </a>

      <!-- CREATE POST -->
      <a
        id="create-post-btn"
        class="header-icon"
        href="/create-post"
        aria-label="Create post"
      >
        <img src="/static/img/create-post.png" alt="Create post">
      </a>

      <!-- NOTIFICATIONS -->
      <button
        id="notification-bell"
        class="header-icon"
        aria-label="Notifications"
        type="button"
      >
        🔔
        <span
          id="notification-badge"
          class="notification-badge hidden"
        >0</span>
      </button>

      <!-- SETTINGS -->
      <button
        id="settings-btn"
        class="header-icon"
        aria-label="Settings"
        type="button"
      >
        ⚙️
      </button>

    </div>

  </div>
</header>
