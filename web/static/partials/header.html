<header class="page-header">
  <div class="page-title-wrap">
    <h1 id="forum-title" class="page-title">
      <a href="/home" class="forum-logo">Forum</a>
    </h1>

    <p id="greeting" class="muted" aria-live="polite" hidden>
      <!-- JS will fill -->
    </p>
  </div>

  <div class="page-actions">
    <a
      id="login-btn"
      class="btn btn-secondary"
      href="/login"
    >
      Login
    </a>

    <button
      id="logout-btn"
      class="btn btn-secondary"
      data-logout-button
      data-logout-url="/api/v1/users/logout"
      type="button"
    >
      Logout
    </button>

    <a id="my-posts-btn" class="btn btn-primary" href="/my-posts">
      My posts
    </a>

    <a id="create-post-btn" class="btn btn-primary" href="/create-post">
      Create post
    </a>
  </div>

  <!-- page-specific JS -->
    <script src="/web/static/js/header.js" defer></script>
</header>
