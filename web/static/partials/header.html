<!-- web/static/partials/header.html -->

<header class="page-header">
  <div class="page-title-wrap">
    <h1 id="forum-title" class="page-title">
      <a href="/" class="forum-logo">Forum</a>
    </h1>

    <p id="greeting" class="muted" aria-live="polite"></p>
  </div>

  <div class="page-actions">

    <!-- GUEST ONLY -->
    <a
      id="login-btn"
      class="btn btn-secondary"
      href="/login"
    >
      Login
    </a>

    <!-- AUTH BUTTONS GROUP -->
    <div class="auth-buttons">
      <a
        id="my-activity-btn"
        class="btn btn-primary auth-only"
        href="/activity"
      >
        My Activity
      </a>

      <a
        id="create-post-btn"
        class="btn btn-primary"
        href="/create-post"
      >
        Create post
      </a>
    </div>

    <!-- RIGHT ICONS (RESERVED SPACE ALWAYS) -->
    <div class="right-icons">

      <!-- NOTIFICATIONS -->
      <div
        class="notification-wrapper auth-only"
        id="notification-wrapper"
      >
        <button
          id="notification-bell"
          class="icon-btn"
          aria-label="Notifications"
          type="button"
        >
          🔔
          <span
            id="notification-badge"
            class="notification-badge hidden"
          >0</span>
        </button>

        <div
          id="notification-dropdown"
          class="notification-dropdown hidden"
        >
          <div class="notification-header">
            Notifications
          </div>
          <div id="notification-list"></div>
        </div>
      </div>

      <!-- SETTINGS -->
      <button
        id="settings-btn"
        class="icon-btn auth-only"
        aria-label="Settings"
        type="button"
      >
        ⚙️
      </button>

    </div>

  </div>
</header>
