<!-- static/partials/settings-modal.html -->

<div id="settings-modal" class="settings-modal hidden">
  <div class="settings-backdrop"></div>

  <div class="settings-card">
    <div class="settings-header">
      <h3>App Settings</h3>
      <button id="settings-close" type="button">✕</button>
    </div>

    <div class="settings-body">
      <div class="setting-item">
        <span>Sound Effects</span>

        <div class="toggle-wrapper">
          <input type="checkbox" id="sfxToggle" />

          <label for="sfxToggle" class="toggleSwitch">

            <!-- SOUND ON SVG -->
            <div class="speaker">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 75 75">
                <path d="M39.389,13.769 L22.235,28.606 L6,28.606 L6,47.699 L21.989,47.699 L39.389,62.75 L39.389,13.769z"
                  style="stroke:#fff;stroke-width:5;stroke-linejoin:round;fill:#fff;">
                </path>
                <path d="M48,27.6a19.5,19.5 0 0 1 0,21.4
                         M55.1,20.5a30,30 0 0 1 0,35.6
                         M61.6,14a38.8,38.8 0 0 1 0,48.6"
                  style="fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round">
                </path>
              </svg>
            </div>

            <!-- SOUND OFF SVG -->
            <div class="mute-speaker">
              <svg viewBox="0 0 75 75" stroke="#fff" stroke-width="5">
                <path d="m39,14-17,15H6V48H22l17,15z"
                  fill="#fff" stroke-linejoin="round">
                </path>
                <path d="m49,26 20,24m0-24-20,24"
                  fill="#fff" stroke-linecap="round">
                </path>
              </svg>
            </div>

          </label>
        </div>
      </div>
    </div>
  </div>
</div>
