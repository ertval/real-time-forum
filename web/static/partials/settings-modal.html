<!-- static/partials/settings-modal.html -->
<div id="settings-modal" class="settings-modal hidden">
  <div class="settings-backdrop"></div>

  <div class="settings-card">
    <div class="settings-header">
      <h3>App Settings</h3>
      <button id="settings-close" type="button">✕</button>
    </div>

    <div class="settings-body">
      <div class="setting-item sfx-setting">
        <span>Sound Effects (SFX)</span>

        <input type="checkbox" id="sfxToggle">

        <label for="sfxToggle" class="sfx-toggle">
            <div class="speaker">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="color: #1f7a3f;">
                <path d="M3 9v6h4l5 5V4L7 9H3z"/>
                <path d="M16 8a4 4 0 010 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
            </div>
            
            <div class="mute-speaker">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="color: #c0392b;">
                <path d="M3 9v6h4l5 5V4L7 9H3z"/>
                <line x1="16" y1="8" x2="21" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="21" y1="8" x2="16" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
        </label>
      </div>
    </div>
  </div>
</div>
