<!-- web/static/partials/auth-modal.html -->

<div id="auth-modal" class="auth-modal hidden" role="dialog" aria-modal="true" aria-labelledby="auth-title">
  <div class="auth-backdrop" aria-hidden="true"></div>

  <div class="auth-box card card-pad" role="document">
    <button class="auth-close" type="button" aria-label="Close">×</button>

    <h2 id="auth-title" class="auth-title">Continue</h2>
    <p class="muted auth-subtitle">Login to interact, or create an account.</p>

    <div class="auth-tabs" role="tablist" aria-label="Authentication tabs">
      <button
        class="auth-tab active"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="auth-login"
        data-tab="login"
      >
        Login
      </button>

      <button
        class="auth-tab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="auth-register"
        data-tab="register"
      >
        Sign up
      </button>
    </div>

    <!-- LOGIN -->
    <form id="auth-login" class="auth-form" role="tabpanel" aria-label="Login form" novalidate>
      <div class="field">
        <label class="field-label" for="auth-login-username">Username</label>
        <input
          id="auth-login-username"
          class="input"
          name="username"
          placeholder="Username"
          autocomplete="username"
          required
        />
      </div>

      <div class="field password-field">
        <label class="field-label" for="auth-login-password">Password</label>
        <div class="password-input-wrap">
          <input
            id="auth-login-password"
            class="input"
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Show password"
            title="Show password"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" type="submit">Login</button>
    </form>

    <!-- REGISTER -->
    <form id="auth-register" class="auth-form hidden" role="tabpanel" aria-label="Register form" novalidate>
      <div class="field">
        <label class="field-label" for="auth-register-username">Username</label>
        <input
          id="auth-register-username"
          class="input"
          name="username"
          placeholder="Username"
          autocomplete="username"
          required
        />
      </div>

      <div class="field">
        <label class="field-label" for="auth-register-email">Email</label>
        <input
          id="auth-register-email"
          class="input"
          type="email"
          name="email"
          placeholder="Email"
          autocomplete="email"
          required
        />
      </div>

      <div class="field password-field">
        <label class="field-label" for="auth-register-password">Password</label>
        <div class="password-input-wrap">
          <input
            id="auth-register-password"
            class="input"
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Show password"
            title="Show password"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="field password-field">
        <label class="field-label" for="auth-register-confirm">Confirm password</label>
        <div class="password-input-wrap">
          <input
            id="auth-register-confirm"
            class="input"
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            class="password-toggle"
            aria-label="Show password"
            title="Show password"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <button class="btn btn-primary btn-full" type="submit">Create Account</button>
    </form>

    <p class="auth-error hidden" role="alert" aria-live="polite"></p>
  </div>
</div>
