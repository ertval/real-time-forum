<!-- web/static/partials/auth-modal.html -->

<div id="auth-modal" class="auth-modal hidden" role="dialog" aria-modal="true">
  <div class="auth-backdrop"></div>

  <div class="auth-box card card-pad">
    <button class="auth-close" aria-label="Close">×</button>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Sign up</button>
    </div>

    <!-- LOGIN -->
    <form id="auth-login" class="auth-form">
      <input class="input" name="username" placeholder="Username" required />
      <input class="input" type="password" name="password" placeholder="Password" required />
      <button class="btn btn-primary" type="submit">Login</button>
    </form>

    <!-- REGISTER -->
    <form id="auth-register" class="auth-form hidden">
        <input
            class="input"
            name="username"
            placeholder="Username"
            required
        />

        <input
            class="input"
            type="email"
            name="email"
            placeholder="Email"
            required
        />

        <input
            class="input"
            type="password"
            name="password"
            placeholder="Password"
            required
        />

        <input
            class="input"
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        />

        <button class="btn btn-primary" type="submit">
            Create Account
        </button>
        </form>

    <p class="auth-error hidden"></p>
  </div>
</div>
