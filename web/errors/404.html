<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 – Not Found</title>

    <!-- Common HTTP error styles -->
    <link rel="stylesheet" href="/errors/common.css" />
</head>

<body class="error-page">

    </p>
